<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 内容安全策略（设计稿 12.4）：脚本只能来自本站，不加载任何外部资源；页面里的文字一律画在 canvas 上。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>雅典娜的城邦 · M0</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c8c5bf; font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  canvas { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #overlay { pointer-events: none; }
  #controls { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
  #controls button {
    font: 500 13px "PingFang SC", "Noto Sans CJK SC", sans-serif; color: #f4f1ec; background: rgba(30, 28, 26, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  #controls button:hover { background: rgba(30, 28, 26, 0.8); }
  #error { position: absolute; inset: 0; display: grid; place-items: center; background: #d8d4cd; }
  #error[hidden] { display: none; }
  #error .card { max-width: 520px; padding: 24px 28px; background: #f6f3ee; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); color: #2a2622; }
  #error .detail { font: 12px ui-monospace, Menlo, monospace; color: #6b625a; white-space: pre-wrap; margin-top: 10px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="overlay"></canvas>
<div id="controls">
  <button id="btn-play" type="button">暂停</button>
  <button id="btn-speed" type="button">速度 ×1</button>
  <button id="btn-follow" type="button">镜头：跟着雅典娜</button>
  <button id="btn-restart" type="button">重新开始</button>
</div>
<div id="error" hidden>
  <div class="card">
    <strong>城邦没能打开</strong>
    <div>这一页需要 WebGL 2 和本地夹具文件。下面是技术细节，反馈时请一并附上。</div>
    <div class="detail"></div>
  </div>
</div>
<script type="module" src="./src/main.mjs"></script>
</body>
</html>
