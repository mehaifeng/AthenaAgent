#athena-startup-designs .a-stage * { box-sizing:border-box; }
#athena-startup-designs .a-window { position:absolute; inset:8px 0 12px; background:var(--a-bg); border:1px solid var(--a-line); border-radius:9px; overflow:hidden; box-shadow:0 8px 24px var(--a-shadow); }
#athena-startup-designs .a-wallpaper { position:absolute; inset:35px 0 0; background-image:var(--a-art); background-position:center; background-size:cover; opacity:.24; }
#athena-startup-designs .a-titlebar { position:relative; height:35px; display:flex; align-items:center; justify-content:space-between; padding:0 13px; background:var(--a-bg); border-bottom:1px solid var(--a-line); font-size:12px; }
#athena-startup-designs .a-title-brand { display:flex; align-items:center; gap:7px; }
#athena-startup-designs .a-window-marks { color:var(--a-muted); }
#athena-startup-designs .a-logo { background-image:var(--a-logo); background-repeat:no-repeat; background-position:center; background-size:contain; border-radius:50%; }
#athena-startup-designs .a-title-logo { width:17px; height:17px; }
#athena-startup-designs .a-panels { position:absolute; inset:41px 6px 6px; display:grid; grid-template-columns:minmax(145px,1.1fr) minmax(220px,2.3fr) minmax(150px,1.2fr); gap:6px; }
#athena-startup-designs .a-panel { position:relative; background:var(--a-panel); border:1px solid var(--a-line); border-radius:4px; min-width:0; opacity:0; }
#athena-startup-designs .a-left { padding:12px 9px; }
#athena-startup-designs .a-launchers { display:grid; grid-template-columns:1fr 1fr; gap:7px; font-size:11px; }
#athena-startup-designs .a-launchers span { text-align:center; padding:6px 1px; border:1px solid var(--a-line); border-radius:3px; white-space:nowrap; }
#athena-startup-designs .a-search { padding:7px 6px; margin-top:15px; border:1px solid var(--a-line); color:var(--a-muted); font-size:11px; border-radius:3px; }
#athena-startup-designs .a-section-label { font-size:11px; color:var(--a-muted); margin:19px 4px 7px; }
#athena-startup-designs .a-tree-heading { font-size:12px; padding:5px 2px; }
#athena-startup-designs .a-tree-item { background:var(--a-soft); padding:7px 14px; margin-top:5px; border-radius:3px; font-size:12px; }
#athena-startup-designs .a-sidebar-footer { position:absolute; bottom:13px; left:12px; right:12px; display:flex; justify-content:space-between; color:var(--a-muted); font-size:11px; }
#athena-startup-designs .a-chat-header { height:44px; padding:12px; border-bottom:1px solid var(--a-line); font-size:12px; display:flex; justify-content:space-between; gap:8px; }
#athena-startup-designs .a-chat-header span { color:var(--a-muted); font-size:11px; }
#athena-startup-designs .a-greeting { position:absolute; inset:55px 10px 103px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:9px; }
#athena-startup-designs .a-welcome-logo { width:44px; height:44px; margin-bottom:5px; }
#athena-startup-designs .a-greeting h3 { font-size:18px; line-height:1.4; font-weight:500; margin:0; }
#athena-startup-designs .a-greeting p { margin:0; color:var(--a-muted); font-size:12px; }
#athena-startup-designs .a-composer { position:absolute; left:12px; right:12px; bottom:13px; height:82px; padding:10px; border:1px solid var(--a-line); border-radius:6px; background:var(--a-bg); color:var(--a-muted); font-size:12px; }
#athena-startup-designs .a-composer>div { display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
#athena-startup-designs .a-send { display:grid; place-items:center; width:23px; height:23px; background:var(--a-fg); color:var(--a-bg); border-radius:4px; }
#athena-startup-designs .a-workbench-tabs { display:flex; gap:14px; padding:12px; border-bottom:1px solid var(--a-line); font-size:12px; }
#athena-startup-designs .a-workbench-tabs span { color:var(--a-muted); }
#athena-startup-designs .a-files { padding:16px 9px; font-size:12px; display:grid; gap:12px; }
#athena-startup-designs .a-workbench-footer { position:absolute; bottom:12px; left:12px; color:var(--a-muted); font-size:11px; }
#athena-startup-designs .a-onboarding { position:absolute; width:344px; height:336px; left:calc(50% - 172px); top:66px; background:var(--a-panel); border:1px solid var(--a-line); border-radius:5px; box-shadow:0 8px 24px var(--a-shadow); overflow:hidden; }
#athena-startup-designs .a-small-titlebar { display:none; height:30px; padding:6px 12px; font-size:11px; border-bottom:1px solid var(--a-line); justify-content:space-between; }
#athena-startup-designs .a-setup-body { display:flex; flex-direction:column; align-items:center; padding:22px 24px; }
#athena-startup-designs .a-setup-logo { height:48px; width:48px; margin-bottom:12px; }
#athena-startup-designs .a-setup-text { width:100%; text-align:center; }
#athena-startup-designs .a-brand { font-family:Georgia,serif; font-size:12px; letter-spacing:3px; margin-bottom:8px; color:var(--a-muted); }
#athena-startup-designs .a-setup-text h3 { font-size:24px; font-weight:500; margin:0 0 7px; line-height:1.3; }
#athena-startup-designs .a-setup-text p { margin:0; color:var(--a-muted); font-size:12px; }
#athena-startup-designs .a-checks { border-top:1px solid var(--a-line); padding-top:13px; margin-top:18px; display:flex; justify-content:center; gap:18px; color:var(--a-muted); font-size:11px; }
#athena-startup-designs .a-enter { display:flex; justify-content:center; gap:20px; background:var(--a-fg); color:var(--a-bg); margin-top:18px; padding:9px 14px; border-radius:2px; font-size:12px; font-family:inherit; width:100%; border:0; }
#athena-startup-designs .a-flying-logo { position:absolute; width:48px; height:48px; left:calc(50% - 24px); top:89px; z-index:3; display:none; }
#athena-startup-designs [data-kind="dissolve"] .a-main { opacity:0; }
#athena-startup-designs [data-kind="dissolve"] .a-small-titlebar { display:flex; }
#athena-startup-designs [data-kind="dissolve"] .a-onboarding { height:366px; top:52px; }
#athena-startup-designs [data-kind="anchor"] .a-title-logo { opacity:0; }
#athena-startup-designs [data-kind="anchor"] .a-flying-logo { display:block; }
#athena-startup-designs [data-kind="anchor"] .a-setup-logo { visibility:hidden; }
@media(max-width:650px) {
  #athena-startup-designs .a-stage { height:440px; }
  #athena-startup-designs .a-panels { grid-template-columns:125px minmax(0,1fr); }
  #athena-startup-designs .a-right { display:none; }
  #athena-startup-designs .a-chat-header span { display:none; }
  #athena-startup-designs .a-launchers { grid-template-columns:1fr; gap:4px; }
  #athena-startup-designs .a-launchers span { padding:4px 1px; }
  #athena-startup-designs .a-search { padding:5px 3px; }
  #athena-startup-designs .a-sidebar-footer span { display:none; }
  #athena-startup-designs .a-onboarding { width:280px; left:calc(50% - 140px); }
  #athena-startup-designs .a-greeting h3 { font-size:16px; }
  #athena-startup-designs .a-greeting p { font-size:11px; }
}
@media(max-width:380px) {
  #athena-startup-designs .a-panels { grid-template-columns:88px minmax(0,1fr); gap:4px; }
  #athena-startup-designs .a-left { padding:8px 4px; }
  #athena-startup-designs .a-search { display:none; }
  #athena-startup-designs .a-tree-heading { font-size:11px; overflow-wrap:anywhere; }
  #athena-startup-designs .a-composer { left:7px; right:7px; }
}
</style>
<script>
(() => {
  const root = document.getElementById('athena-startup-designs');
  const template = document.getElementById('athena-startup-scene');
  const records = [];
  const preferences = { speed: 1 };
  const stored = window.openai?.widgetState?.privateContent;
  if (stored && [0.5, 1].includes(stored.speed)) preferences.speed = stored.speed;
  const durations = { reveal:360, dissolve:320, anchor:480, panels:400 };
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const ease = 'cubic-bezier(.2,.7,.2,1)';
  function remember() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({privateContent:{speed:preferences.speed}}).catch(() => {});
  }
  for (const stage of root.querySelectorAll('.a-stage')) {
    stage.append(template.content.cloneNode(true));
    const section = stage.parentElement;
    const record = {stage, section, animations:[], running:false, button:section.querySelector('[data-play]'), status:section.querySelector('[data-status]')};
    records.push(record);
    record.button.addEventListener('click', () => play(record));
    stage.querySelector('.a-enter').addEventListener('click', () => play(record));
  }
  function animate(record, element, frames, duration, delay=0) {
    const animation = element.animate(frames, {duration:duration/preferences.speed,delay:delay/preferences.speed,easing:ease,fill:'both'});
    record.animations.push(animation);
    return animation;
  }
  function reset(record) {
    record.animations.forEach(animation => animation.cancel());
    record.animations = [];
    record.stage.querySelectorAll('[style]').forEach(element => element.removeAttribute('style'));
  }
  async function play(record) {
    if(record.running) return;
    record.running = true;
    record.button.disabled = true;
    reset(record);
    const {stage,status} = record;
    const kind = stage.dataset.kind;
    const main = stage.querySelector('.a-main');
    const onboarding = stage.querySelector('.a-onboarding');
    const panels = [...stage.querySelectorAll('.a-panel')];
    status.textContent = '初始化完成';
    await new Promise(resolve => setTimeout(resolve, reducedMotion.matches ? 0 : 420));
    status.textContent = '正在过渡';
    if(reducedMotion.matches) {
      main.style.opacity = '1';
      onboarding.style.opacity = '0';
      panels.forEach(panel => panel.style.opacity = '1');
      stage.querySelector('.a-flying-logo').style.display = 'none';
      stage.querySelector('.a-title-logo').style.opacity = '1';
    } else if(kind === 'reveal') {
      animate(record,onboarding,[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-8px)'}],190);
      panels.forEach(panel => animate(record,panel,[{opacity:0},{opacity:1}],240,120));
    } else if(kind === 'dissolve') {
      animate(record,main,[{opacity:0},{opacity:1}],220);
      panels.forEach(panel => panel.style.opacity='1');
      animate(record,onboarding,[{opacity:1},{opacity:0}],180,140);
    } else if(kind === 'anchor') {
      const flying = stage.querySelector('.a-flying-logo');
      const target = stage.querySelector('.a-title-logo').getBoundingClientRect();
      const source = flying.getBoundingClientRect();
      const dx = target.x+target.width/2-source.x-source.width/2;
      const dy = target.y+target.height/2-source.y-source.height/2;
      animate(record,onboarding,[{opacity:1},{opacity:0}],160);
      animate(record,flying,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx}px,${dy}px) scale(${target.width/source.width})`}],480);
      panels.forEach(panel => animate(record,panel,[{opacity:0},{opacity:1}],270,150));
    } else {
      animate(record,onboarding,[{opacity:1},{opacity:0}],150);
      animate(record,stage.querySelector('.a-center'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],250,70);
      animate(record,stage.querySelector('.a-left'),[{opacity:0,transform:'translateX(-12px)'},{opacity:1,transform:'translateX(0)'}],230,120);
      animate(record,stage.querySelector('.a-right'),[{opacity:0,transform:'translateX(12px)'},{opacity:1,transform:'translateX(0)'}],230,170);
    }
    await Promise.all(record.animations.map(animation => animation.finished.catch(() => {})));
    onboarding.style.visibility = 'hidden';
    record.status.textContent = reducedMotion.matches ? '已进入主窗体 · 减少动态效果' : '已进入主窗体';
    record.button.textContent = '再次播放';
    record.button.disabled = false;
    record.running = false;
  }
  function renderSettings() {
    records.forEach(({stage,section}) => {
      const text = durations[stage.dataset.kind]+' ms'+(preferences.speed===0.5?' · 半速预览':'');
      section.querySelector('[data-duration]').textContent = text;
    });
  }
  renderSettings();
  window.addEventListener('openai:set_globals', event => {
    const next = event.detail?.globals?.widgetState?.privateContent;
    if(next && [0.5,1].includes(next.speed)) { preferences.speed=next.speed; renderSettings(); }
  });
  if(globalThis.Tweak) {
    const design = { slow:preferences.speed===0.5 };
    const tweak = new Tweak({container:root,onChange:()=>{preferences.speed=design.slow?0.5:1;renderSettings();remember();}});
    tweak.addToggle(design,'slow',{label:'半速预览'});
  }
})();
</script>
