name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Athena.UI.sln

      - name: Build and analyze
        run: dotnet build Athena.UI.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Archive tests
        run: dotnet run --project Athena.Archive.Tests --configuration Release --no-build

      - name: Headless UI tests
        run: dotnet run --project Athena.UI.HeadlessTests --configuration Release --no-build
