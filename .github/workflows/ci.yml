name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Athena.UI.sln

      - name: Build and analyze
        run: dotnet build Athena.UI.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Archive tests
        run: dotnet run --project Athena.Archive.Tests --configuration Release --no-build

      - name: Headless UI tests
        # 该步骤曾在无头 Linux 渲染下挂起并耗尽 GitHub 6 小时作业上限，
        # 用 timeout 兜底让挂起尽快失败并保留可诊断日志。
        run: timeout 900 dotnet run --project Athena.UI.HeadlessTests --configuration Release --no-build
