name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example 0.1.5 or v0.1.5"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release options
        id: options
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ inputs.draft }}" = "true" ]; then
              echo "draft=--draft" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./release.sh
          ./release.sh "${{ steps.options.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --upload \
            --generate-notes \
            ${{ steps.options.outputs.prerelease }} \
            ${{ steps.options.outputs.draft }}

  dmg:
    name: Build macOS DMG
    needs: release
    runs-on: macos-latest
    if: ${{ needs.release.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release options
        id: options
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG for osx-arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./release.sh
          TAG="${{ steps.options.outputs.tag }}"
          # Build only the macOS platform with DMG; --skip-upload prevents
          # gh release create so we can append the DMG to the release
          # the upstream job already created.
          ./release.sh "${TAG#v}" \
            --platforms osx-arm64 \
            --dmg \
            --skip-upload \
            --repo "${GITHUB_REPOSITORY}"
          ls -lh "artifacts/releases/${TAG#v}/"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.options.outputs.tag }}"
          cd "artifacts/releases/${TAG#v}"
          gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            Athena-*.dmg

  windows-installer:
    name: Build Windows Installer
    needs: release
    runs-on: windows-latest
    if: ${{ needs.release.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release options
        id: options
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish win-x64
        shell: pwsh
        run: |
          $tag = "${{ steps.options.outputs.tag }}"
          $version = $tag -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $out = "publish/win-x64"
          # App + updater go into the same folder the installer bundles.
          dotnet publish Athena.UI.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -p:InformationalVersion=$version `
            -p:FileVersion=$version -p:AssemblyVersion=$version `
            -p:PublishSingleFile=false -p:UseAppHost=true -o $out
          dotnet publish Athena.Updater/Athena.Updater.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -p:InformationalVersion=$version `
            -p:FileVersion=$version -p:AssemblyVersion=$version `
            -p:PublishSingleFile=false -p:UseAppHost=true -o "$out/updater"
          if (-not (Test-Path "$out/Athena.UI.exe")) { throw "Athena.UI.exe missing in publish output" }
          if (-not (Test-Path "$out/updater/Athena.Updater.exe")) { throw "Athena.Updater.exe missing in publish output" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Ensure Simplified Chinese language file
        shell: pwsh
        run: |
          # Prefer the ChineseSimplified.isl that ships with the installed Inno
          # Setup (guaranteed to match the compiler version). Only fall back to
          # downloading from upstream if this Inno Setup build does not bundle it.
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $dest = "$langDir\ChineseSimplified.isl"
          if (-not (Test-Path $dest)) {
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
            Invoke-WebRequest -Uri $url -OutFile $dest
          }
          if (-not (Test-Path $dest)) { throw "ChineseSimplified.isl is unavailable" }

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup resolves relative paths against the .iss file's folder,
          # not the working directory — pass absolute paths so SourceDir and the
          # SetupIconFile under RepoRoot\Assets resolve correctly.
          $root = (Get-Location).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:VERSION" `
            "/DSourceDir=$root\publish\win-x64" `
            "/DRepoRoot=$root" `
            "/O$root\Output" `
            "$root\Scripts\windows-installer.iss"
          Get-ChildItem "$root\Output"

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.options.outputs.tag }}"
          gh release upload "$tag" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --clobber `
            "Output\Athena-$env:VERSION-win-x64-setup.exe"
