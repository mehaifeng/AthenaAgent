name: Built-in browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/browser-runtime.yml'
      - '.github/workflows/release.yml'
      - 'Services/ComputerUse/**'
      - 'Services/ModelRoleProbeService.cs'
      - 'ViewModels/*Browser*.cs'
      - 'ViewModels/ProviderModelsViewModel.cs'
      - 'Views/*Browser*'
      - 'Views/ProviderModelsView.axaml'
      - 'Athena.UI.HeadlessTests/**'
      - 'Scripts/stage-browser-runtime.py'
      - 'release.sh'
      - 'Athena.UI.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Stage the release browser payload
        shell: bash
        run: python Scripts/stage-browser-runtime.py "${{ matrix.rid }}" "${{ runner.temp }}/athena-browser"
      - name: Build local PTC packages
        shell: bash
        run: bash Libraries/Ptc/scripts/build-local-feed.sh
      - name: Exercise the bundled browser and model roles
        shell: bash
        env:
          ATHENA_HEADLESS_ONLY: computer-use
          ATHENA_BROWSER_SMOKE: '1'
          ATHENA_BROWSER_RUNTIME_DIRECTORY: ${{ runner.temp }}/athena-browser/BrowserRuntime
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bash Scripts/run-headless-tests.sh
          else
            bash Scripts/run-headless-tests.sh
          fi
